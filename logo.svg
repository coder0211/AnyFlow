<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="any-flow logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- main flow: entry step down through the steps -->
    <line x1="24" y1="16" x2="24" y2="48"/>
    <!-- branch: a clean C-loop from the last step back up into the middle step -->
    <path d="M24 48 C 44 48, 44 32, 24 32"/>
  </g>
  <g fill="#ffffff">
    <circle cx="24" cy="32" r="4.8"/>
    <circle cx="24" cy="48" r="4.8"/>
  </g>
  <!-- entry step highlighted -->
  <circle cx="24" cy="16" r="4.8" fill="#7dffb3"/>
</svg>
